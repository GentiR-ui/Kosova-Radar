# SaaS factory configuration. Read by hooks and scripts.
# Claude cannot edit this file (hook + permission deny). Only the human changes it.

# Paths frozen by scripts/approve-spec.sh. Directories end with "/".
LOCKED_PATHS="docs/requirements.md tests/App.AcceptanceTests/ web/e2e/acceptance/"

# Implementation paths the test-author subagent may NOT read (keeps tests independent of code).
IMPLEMENTATION_PATHS="src/ web/src/"

# Paths nobody but the human may change (dir/ = whole folder, * = glob anywhere).
ALWAYS_PROTECTED=".factory/spec-lock/ .factory/factory.conf .factory/secret-patterns.txt .factory/waivers .factory/goal.txt scripts/ .claude/ *Directory.Build.props *Directory.Build.targets *Directory.Build.rsp *Directory.Packages.props"

# 1 = Claude may run approve-spec.sh itself (full autonomy). Also remove the matching
# "deny" lines in .claude/settings.json. Default 0 = the human approves the spec.
SELF_APPROVE=0

# 1 = a full verify may pass without Docker (skips integration + E2E). Keep 0 for real releases.
ALLOW_DOCKER_SKIP=0

# How many times the Stop gate blocks in a row before letting Claude stop (it then must log a blocker).
STOP_GATE_MAX_BLOCKS=3
